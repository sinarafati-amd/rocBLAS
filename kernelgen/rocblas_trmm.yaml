- rocblas_status_not_impl
- rocblas_trmm_impl
- rocblas_trmm_outofplace_template
- rocblas_trmm_template
- rocblas_type_from_ptr_t_impl
compile_command:
- ./install.sh --architecture gfx942 --clients --relwithdebinfo --no_hipblaslt
correctness_command:
- build/release-debug/clients/staging/rocblas-bench -f trmm -r s -n 10 --verify 1 --iters 1
performance_command:
- /opt/rocm/bin/rocprof-compute profile -n kernelgen --path rocprof_compute_profile --no-roof --join-type kernel -b SQ -b TCP -b TCC -- build/release-debug/clients/staging/rocblas-bench -f trmm -r s -m 3000 -n 3000 --lda 3000 --iters 2
- /opt/rocm/bin/rocprof-compute analyze --path rocprof_compute_profile -b 2
