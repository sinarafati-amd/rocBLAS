source_file_path: &id001
- library/src/blas3/rocblas_gemm.hpp
- library/src/blas_ex/rocblas_blas_ex_threshold.hpp
- library/src/blas_ex/rocblas_gemmt.cpp
- library/src/blas_ex/rocblas_gemmt.hpp
- library/src/blas_ex/rocblas_gemmt_imp.hpp
- library/src/blas_ex/rocblas_gemmt_kernels.cpp
- library/src/blas_ex/rocblas_gemmt_kernels.hpp
- library/src/include/rocblas_ostream.hpp
- library/src/src64/blas3/rocblas_gemm_64.hpp
- library/src/include/check_numerics_matrix.hpp
- library/src/include/check_numerics_vector.hpp
- library/src/include/definitions.hpp
- library/src/include/device_macros.hpp
- library/src/include/handle.hpp
- library/src/include/int64_helpers.hpp
- library/src/include/logging.hpp
- library/src/include/macros.hpp
- library/src/include/tuple_helper.hpp
- library/src/include/utility.hpp
gen_file_path: *id001
target_kernel_functions:
- rocblas_gemm_flags_fp16_alt_impl
- rocblas_gemmt_impl
- rocblas_internal_gemm_template
- rocblas_internal_gemmt_batched_strided_batched_block_recursive_template
- rocblas_internal_gemmt_general_template
- rocblas_internal_gemmt_non_batch_block_recursive_template
compile_command:
- ./install.sh --architecture gfx942 --clients --relwithdebinfo
correctness_command:
- build/release-debug/clients/staging/rocblas-test --gtest_filter="*GEMMT.*"
performance_command:
- rocprof-compute profile -n kernelgen --path rocprof_compute_profile --no-roof --join-type kernel -b SQ -b TCP -b TCC -- build/release-debug/clients/staging/rocblas-bench -f gemmt -r s -m 3000 -n 3000 --lda 3000 --iters 2
- rocprof-compute analyze --path rocprof_compute_profile -b 2
