source_file_path: &id001
- library/src/blas3/rocblas_gemm.hpp
- library/src/blas3/rocblas_symm_hemm.hpp
- library/src/blas3/rocblas_symm_hemm_kernels.cpp
- library/src/include/rocblas_ostream.hpp
- library/src/src64/blas3/rocblas_gemm_64.hpp
- library/src/include/check_numerics_matrix.hpp
- library/src/include/check_numerics_vector.hpp
- library/src/include/definitions.hpp
- library/src/include/device_macros.hpp
- library/src/include/handle.hpp
- library/src/include/macros.hpp
- library/src/include/utility.hpp
gen_file_path: *id001
target_kernel_functions:
- rocblas_gemm_flags_fp16_alt_impl
- rocblas_internal_gemm_template
- rocblas_internal_hemm_template
- rocblas_internal_symm_template
- rocblas_symm_hemm_template
compile_command:
- ./install.sh --architecture gfx942 --clients --relwithdebinfo
correctness_command:
- build/release-debug/clients/staging/rocblas-test --gtest_filter="*SYMM.*:*HEMM.*"
performance_command:
- rocprof-compute profile -n kernelgen --path rocprof_compute_profile --no-roof --join-type kernel -b SQ -b TCP -b TCC -- build/release-debug/clients/staging/rocblas-bench -f symm -r s -m 3000 -n 3000 --lda 3000 --iters 2
- rocprof-compute analyze --path rocprof_compute_profile -b 2
