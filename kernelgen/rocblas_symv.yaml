source_file_path: &id001
- library/src/blas2/rocblas_hemv_symv.hpp
- library/src/blas2/rocblas_symv.cpp
- library/src/blas2/rocblas_symv_imp.hpp
- library/src/include/rocblas_ostream.hpp
- library/src/include/definitions.hpp
- library/src/include/handle.hpp
- library/src/include/int64_helpers.hpp
- library/src/include/logging.hpp
- library/src/include/macros.hpp
- library/src/include/tuple_helper.hpp
- library/src/include/utility.hpp
gen_file_path: *id001
target_kernel_functions:
- rocblas_check_numerics_he_matrix_template
- rocblas_internal_hemv_template
- rocblas_internal_symv_template
- rocblas_status_not_impl
- rocblas_symv_impl
compile_command:
- ./install.sh --architecture gfx942 --clients --relwithdebinfo
correctness_command:
- build/release-debug/clients/staging/rocblas-test --gtest_filter="*SYMV.*"
performance_command:
- rocprof-compute profile -n kernelgen --path rocprof_compute_profile --no-roof --join-type kernel -b SQ -b TCP -b TCC -- build/release-debug/clients/staging/rocblas-bench -f symv -r s -m 3000 -n 3000 --lda 3000 --iters 2
- rocprof-compute analyze --path rocprof_compute_profile -b 2
