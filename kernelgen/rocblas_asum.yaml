source_file_path: &id001
- library/src/blas1/rocblas_asum.cpp
- library/src/blas1/rocblas_asum_imp.hpp
- library/src/blas1/rocblas_asum_nrm2.hpp
- library/src/blas1/rocblas_dot.hpp
- library/src/blas1/rocblas_reduction.hpp
- library/src/include/rocblas_ostream.hpp
- library/src/blas1/fetch_template.hpp
- library/src/blas1/reduction.hpp
- library/src/include/check_numerics_vector.hpp
- library/src/include/definitions.hpp
- library/src/include/device_macros.hpp
- library/src/include/handle.hpp
- library/src/include/int64_helpers.hpp
- library/src/include/logging.hpp
- library/src/include/macros.hpp
- library/src/include/tuple_helper.hpp
- library/src/include/utility.hpp
gen_file_path: *id001
target_kernel_functions:
- rocblas_asum_impl
- rocblas_internal_dot_template
compile_command:
- ./install.sh --architecture gfx942 --clients --relwithdebinfo
correctness_command:
- build/release-debug/clients/staging/rocblas-test --gtest_filter="*ASUM.*"
performance_command:
- rocprof-compute profile -n kernelgen --path rocprof_compute_profile --no-roof --join-type kernel -b SQ -b TCP -b TCC -- build/release-debug/clients/staging/rocblas-bench -f asum -r s -m 3000 -n 3000 --lda 3000 --iters 2
- rocprof-compute analyze --path rocprof_compute_profile -b 2
