source_file_path: &id001
- library/src/blas1/rocblas_copy.hpp
- library/src/blas2/rocblas_tpmv.cpp
- library/src/blas2/rocblas_tpmv.hpp
- library/src/blas2/rocblas_tpmv_imp.hpp
- library/src/blas2/rocblas_tpmv_kernels.cpp
- library/src/include/rocblas_ostream.hpp
- library/src/include/check_numerics_vector.hpp
- library/src/include/definitions.hpp
- library/src/include/device_macros.hpp
- library/src/include/handle.hpp
- library/src/include/int64_helpers.hpp
- library/src/include/logging.hpp
- library/src/include/macros.hpp
- library/src/include/tuple_helper.hpp
- library/src/include/utility.hpp
gen_file_path: *id001
target_kernel_functions:
- rocblas_check_numerics_tp_matrix_template
- rocblas_tpmv_impl
compile_command:
- ./install.sh --architecture gfx942 --clients --relwithdebinfo
correctness_command:
- build/release-debug/clients/staging/rocblas-test --gtest_filter="*TPMV.*"
performance_command:
- rocprof-compute profile -n kernelgen --path rocprof_compute_profile --no-roof --join-type kernel -b SQ -b TCP -b TCC -- build/release-debug/clients/staging/rocblas-bench -f tpmv -r s -m 3000 -n 3000 --lda 3000 --iters 2
- rocprof-compute analyze --path rocprof_compute_profile -b 2
