- library/src/blas_ex/rocblas_trsv_batched_ex.cpp
- library/src/blas_ex/rocblas_trsv_inverse.hpp
- library/src/include/rocblas_ostream.hpp
- library/src/blas1/reduction.hpp
- library/src/blas2/gemv_device.hpp
