- rocblas_internal_trsv_inverse_template
- rocblas_real_t_impl
- rocblas_status_not_impl
- rocblas_trsv_batched_ex_impl
- rocblas_type_from_ptr_t_impl
compile_command:
- ./install.sh --architecture gfx942 --clients --relwithdebinfo
correctness_command:
- build/release-debug/clients/staging/rocblas-test --gtest_filter="*TRSV_BATCHED_EX.*"
performance_command:
- rocprof-compute profile -n kernelgen --path rocprof_compute_profile --no-roof --join-type kernel -b SQ -b TCP -b TCC -- build/release-debug/clients/staging/rocblas-bench -f trsv -r s -m 3000 -n 3000 --lda 3000 --iters 2
- rocprof-compute analyze --path rocprof_compute_profile -b 2
