- library/src/include/tuple_helper.hpp
- library/src/include/utility.hpp
gen_file_path: *id001
target_kernel_functions:
- rocblas_gemm_flags_fp16_alt_impl
- rocblas_internal_gemm_template
- rocblas_internal_trmm_template
- rocblas_internal_trsm_template
- rocblas_internal_trtri_template
- rocblas_set_matrix_zero_if_alpha_zero_template
- rocblas_status_not_impl
- rocblas_trtri_trsm_template
compile_command:
- ./install.sh --architecture gfx942 --clients --relwithdebinfo
correctness_command:
- build/release-debug/clients/staging/rocblas-test --gtest_filter="*TRSM.*:*BATCHED.*"
performance_command:
- rocprof-compute profile -n kernelgen --path rocprof_compute_profile --no-roof --join-type kernel -b SQ -b TCP -b TCC -- build/release-debug/clients/staging/rocblas-bench -f trsm -r s -m 3000 -n 3000 --lda 3000 --iters 2
- rocprof-compute analyze --path rocprof_compute_profile -b 2
