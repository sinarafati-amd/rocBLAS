- library/src/blas3/rocblas_trsm.hpp
- library/src/blas3/rocblas_trsm_batched.cpp
- library/src/blas3/rocblas_trsm_batched_imp.hpp
- library/src/blas3/rocblas_trsm_batched_kernels.cpp
- library/src/blas3/rocblas_trsm_kernels.hpp
- library/src/blas3/rocblas_trtri.hpp
- library/src/blas_ex/rocblas_gemm_ex.hpp
- library/src/include/rocblas_ostream.hpp
- library/src/src64/blas3/rocblas_gemm_64.hpp
- library/src/blas3/Tensile/gemm_tensile.hpp
