source_file_path: &id001
- library/src/blas3/rocblas_gemm.hpp
- library/src/blas3/rocblas_syr2k_her2k.hpp
- library/src/blas3/rocblas_syrkx.cpp
- library/src/blas3/rocblas_syrkx_herkx.hpp
- library/src/blas3/rocblas_syrkx_imp.hpp
- library/src/include/rocblas_ostream.hpp
- library/src/blas3/herk_syrk_device.hpp
- library/src/include/check_numerics_matrix.hpp
- library/src/include/check_numerics_vector.hpp
- library/src/include/definitions.hpp
- library/src/include/device_macros.hpp
- library/src/include/handle.hpp
- library/src/include/int64_helpers.hpp
- library/src/include/logging.hpp
- library/src/include/macros.hpp
- library/src/include/tuple_helper.hpp
- library/src/include/utility.hpp
gen_file_path: *id001
target_kernel_functions:
- rocblas_internal_her2k_template
- rocblas_internal_herkx_template
- rocblas_internal_syr2k_her2k_template
- rocblas_internal_syr2k_template
- rocblas_internal_syrkx_template
- rocblas_syrkx_impl
compile_command:
- ./install.sh --architecture gfx942 --clients --relwithdebinfo
correctness_command:
- build/release-debug/clients/staging/rocblas-test --gtest_filter="*SYRKX.*"
performance_command:
- rocprof-compute profile -n kernelgen --path rocprof_compute_profile --no-roof --join-type kernel -b SQ -b TCP -b TCC -- build/release-debug/clients/staging/rocblas-bench -f syrkx -r s -m 3000 -n 3000 --lda 3000 --iters 2
- rocprof-compute analyze --path rocprof_compute_profile -b 2
