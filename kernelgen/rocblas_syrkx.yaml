- rocblas_internal_syr2k_her2k_template
- rocblas_internal_syr2k_template
- rocblas_internal_syrkx_batched_template
- rocblas_internal_syrkx_template
- rocblas_real_t_impl
- rocblas_syrkx_impl
- rocblas_type_from_ptr_t_impl
compile_command:
- ./install.sh --architecture gfx942 --clients --relwithdebinfo --no_hipblaslt
correctness_command:
- build/release-debug/clients/staging/rocblas-bench -f syrkx -r s -n 10 --verify 1 --iters 1
performance_command:
- /opt/rocm/bin/rocprof-compute profile -n kernelgen --path rocprof_compute_profile --no-roof --join-type kernel -b SQ -b TCP -b TCC -- build/release-debug/clients/staging/rocblas-bench -f syrkx -r s -m 3000 -n 3000 --lda 3000 --iters 2
- /opt/rocm/bin/rocprof-compute analyze --path rocprof_compute_profile -b 2
