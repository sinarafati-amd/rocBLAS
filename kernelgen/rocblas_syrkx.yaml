target_kernel_functions:
- __launch_bounds__
- rocblas_array2_t_impl
- rocblas_batched_t_impl
- rocblas_const_batched_t_impl
- rocblas_internal_check_numerics_matrix_template
- rocblas_internal_check_numerics_vector_template
- rocblas_internal_her2k_batched_template
- rocblas_internal_her2k_template
- rocblas_internal_herkx_batched_template
